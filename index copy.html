<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Catálogo de gráficas y proyectos de la Agencia Digital.">
  <meta name="keywords" content="gráficas, visualizaciones, Python, R, datos">
  <meta name="author" content="Agencia Digital">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lineamientos de estilos - Agencia Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="barra-logo">
    <img src="imagenes/logo_gob.svg" class="logo-izquierdo" alt="Logo del gobierno">
    <div class="menu-dropdown-wrapper">
      <button class="menu-toggle">
        <img src="imagenes/Menu.svg" alt="Menu" width="30" height="30">
      </button>
      <div class="menu-dropdown" id="menuDropdown">
        <a href="index.html">Inicio</a>
        <a href="graficas-python.html">Python</a>
        <a href="graficas-r.html">RStudio</a>
      </div>
    </div>
  </header>

  <h1>Lineamientos de estilos</h1>
  <p style="text-align: center;">Explora visualizaciones y proyectos de la Agencia de Transformación Digital y Telecomunicaciones.</p>

  <div class="catalogo-graficas">
    <h2>Catálogo de Gráficas</h2>
    <div class="catalogo-grid">
      <div class="grid-sizer"></div>
      <a href="graficas-tendencias.html" title="Ver más sobre tendencias">
        <img src="Python/agrupadasyapiladas/grafica_agrupadasyapiladas.svg" alt="Gráfica de tendencias">
        <span class="titulo-grafica">Tendencias</span>
      </a>
      <a href="graficas-comparativas.html" title="Ver más comparativas">
        <img src="Python/snapshot/snapshot.svg" alt="Gráfica comparativa">
        <span class="titulo-grafica">Comparativas</span>
      </a>
      <a href="graficas-demograficas.html" title="Ver más demográficas">
        <img src="Python/areaplot2/areaplot2_svgo.svg" alt="Gráfica demográfica">
        <span class="titulo-grafica">Demográficas</span>
      </a>
      <a href="graficas-series.html" title="Ver más series de tiempo">
        <img src="Python/linea/linea.svg" alt="Gráfica de series de tiempo">
        <span class="titulo-grafica">Series de tiempo</span>
      </a>
      <a href="graficas-barras.html" class="grafica-ancha">
        <img src="Python/barras/output/barras_verticales_svgo.svg" alt="Gráficas de barras">
        <span class="titulo-grafica">Barras</span>
      </a>
      <!-- Puedes agregar más categorías aquí -->
    </div>
  </div>

  <div class="proyectos">
    <h2>Proyectos</h2>
    <ul>
      <li><a href="graficas-python.html" target="_blank">Python</a></li>
      <li><a href="graficas-r.html" target="_blank">RStudio</a></li>
    </ul>
  </div>

  <!-- Masonry.js y imagesLoaded desde CDN -->
  <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
  <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
  <script>
    // Menú desplegable
    const menuToggle = document.querySelector('.menu-toggle');
    const menuDropdown = document.getElementById('menuDropdown');

    menuToggle.addEventListener('click', function() {
      menuDropdown.style.display = menuDropdown.style.display === 'flex' ? 'none' : 'flex';
    });

    document.addEventListener('click', function(event) {
      if (!menuDropdown.contains(event.target) && !menuToggle.contains(event.target)) {
        menuDropdown.style.display = 'none';
      }
    });

    // Inicializar Masonry SOLO después de que las imágenes hayan cargado
    document.addEventListener('DOMContentLoaded', function() {
      var grid = document.querySelector('.catalogo-grid');
      if (grid) {
        imagesLoaded(grid, function() {
          new Masonry(grid, {
            itemSelector: 'a',
            columnWidth: '.grid-sizer',
            percentPosition: true,
            gutter: 16
          });
        });
      }
    });
  </script>
</body>
</html>
