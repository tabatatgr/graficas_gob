# Receta para barras apiladas verticales - Datos temporales
# Configuración basada en el ejemplo EXPORTAR: barras_apiladas_verticales

# Tipo de gráfico que se generará
tipo_grafico: "barras_verticales"

metadata:
  titulo: "Barras Apiladas Verticales"
  descripcion: "Gráfico de barras verticales apiladas con valores dentro de las barras y leyenda"
  version: "1.0"
  autor: "Sistema de Generación Masiva"
  fecha: "2025-01-10"

# Configuración del gráfico
grafico:
  tipo: "barras_verticales"
  
# Configuración de datos
datos:
  # El CLI proporcionará el DataFrame desde el archivo Excel/CSV
  # Esperamos datos con múltiples columnas para el apilado
  hoja: null  # Se usará la hoja por defecto
  rango: null # Se usarán todos los datos

# Parámetros de la función barras_verticales
parametros:
  # Configuración básica
  nombre: "barras_apiladas_verticales"
  bar_height: 1
  font: "Arial"
  fontsize_barra: 24
  fontsize_valor_total: 20  # Por defecto de la función
  origen_barras: "y"        # Las barras salen del eje Y
  
  # Ordenamiento
  ordenar_por: "etiqueta"
  orden: "ascendente"
  
  # Configuración de valores y etiquetas
  valor_barra: true          # Muestra valores dentro de las barras
  porcentaje_barra: false    # No muestra porcentajes dentro de las barras
  porcentaje_total: false     # No muestra porcentaje total arriba
  valor_total: true          # Por defecto en la función
  
  # Configuración visual
  area_min: 500              # Área mínima para mostrar etiquetas
  grillas: true              # Por defecto en la función
  
  # Configuración de leyenda
  leyenda: true              # Muestra leyenda
  posicion_leyenda: "arriba" # Por defecto en la función
  ncol_leyenda: null         # Automático basado en número de categorías
  
  # Configuración de figura
  aumenta_ancho_fig: 0
  aumenta_alto_fig: 0
  aumenta_sep_leyenda: 0.2
  
  # Configuración de colores (usará paleta por defecto)
  paleta_colores: null       # Usará: ["#10302C", "#4C6A67", "#8FA8A6", "#A3C9A8"]
  
  # Configuración de cápsulas
  quitar_capsula: false
  capsulas_cero: true
  
  # Configuración de orientación
  orientacion_etiqueta_x: null  # Vertical por defecto (90 grados)
  
  # Configuración de ejes
  nombre_eje_x: null
  nombre_eje_y: null
  y_limits: null
  
  # Configuración de unión de barras
  union_izquierda: 0
  union_derecha: 0
  
  # Configuración de datos adicionales
  agregar_datos: null
  asignar_etiquetas: null
  sustituir_etiquetas: null
  
  # Configuración de porcentajes
  porcentaje_abajo: true
  porcentaje_total_inicio: false
  porcentaje_divergente: false
  
  # Configuración de espaciado
  separar_por_total: 0.0
  espacio_inicio: 0
  altura_min: 0
  
  # Configuración de ejes especiales
  ejeY_negativo_a_positivo: true   # Invertimos el eje Y
  resaltar_etiquetas: null
  
  # Configuración de colores de texto
  color_valor_barra: null

# Configuración de exclusiones
exclusiones: []

# Configuración de salida
salida:
  formato: ["png", "svg"]
  dpi: 300
  optimizar_svg: true
  directorio: "output"
  
# Notas para el usuario
notas:
  - "Esta receta genera un gráfico de barras verticales apiladas"
  - "Ideal para datos temporales con múltiples categorías"
  - "Muestra valores dentro de cada segmento de la barra"
  - "Incluye leyenda para identificar las categorías"
  - "Las etiquetas se ordenan cronológicamente (ascendente)"
  - "Muestra el porcentaje total de cada barra"
  - "Usa la paleta de colores por defecto gubernamental"
  - "Área mínima de 500 para mostrar etiquetas dentro de las barras"