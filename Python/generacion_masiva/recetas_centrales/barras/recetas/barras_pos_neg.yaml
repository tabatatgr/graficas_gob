# Receta para barras divergentes
# Configuración basada en el ejemplo de barras con valores positivos y negativos

# Tipo de gráfico que se generará
tipo_grafico: "barras_verticales"

metadata:
  titulo: "Barras Divergentes"
  descripcion: "Gráfico de barras verticales apiladas con valores positivos y negativos"
  version: "1.0"
  autor: "Sistema de Generación Masiva"
  fecha: "2025-01-10"

# Configuración del gráfico
grafico:
  tipo: "barras_verticales"
  nombre: "barras_divergentes"
  
# Configuración de datos
datos:
  hoja: null
  rango: null

# Parámetros de la función barras_verticales
parametros:
  # Configuración básica
  bar_height: 0.65
  font: "Montserrat"
  fontsize_barra: 9              # Tamaño pequeño para etiquetas internas
  fontsize_valor_total: 20
  
  # ** CONFIGURACIÓN PRINCIPAL: SIN ORDENAMIENTO **
  ordenar_por: false             # Mantiene el orden original (temporal)
  orden: "ascendente"
  
  # ** CONFIGURACIÓN PRINCIPAL: VALORES Y PORCENTAJES **
  valor_barra: true              # Muestra valores absolutos dentro de barras
  valor_total: true              # Muestra totales arriba y abajo
  porcentaje_barra: true         # Muestra porcentajes dentro de barras
  porcentaje_total: false        # No muestra porcentaje total arriba
  
  # ** CONFIGURACIÓN PRINCIPAL: MANEJO DE DIVERGENTES **
  porcentaje_divergente: true    # Calcula porcentajes por sección (pos/neg)
  ejeY_negativo_a_positivo: false # Mantiene valores negativos como negativos
  
  # ** CONFIGURACIÓN PRINCIPAL: CÁPSULAS **
  capsulas_cero: false           # No muestra cápsulas cuando el total es cero
  
  # ** CONFIGURACIÓN PRINCIPAL: FORMATO DE ETIQUETAS **
  porcentaje_abajo: false        # Porcentajes al lado de valores
  area_min: 0                    # Muestra todas las etiquetas sin restricción
  
  # ** CONFIGURACIÓN PRINCIPAL: LEYENDA **
  leyenda: true                  # Muestra leyenda
  posicion_leyenda: "abajo"      # Leyenda en la parte inferior
  ncol_leyenda: 2                # Leyenda en 2 columnas
  
  # ** CONFIGURACIÓN PRINCIPAL: ORIENTACIÓN **
  orientacion_etiqueta_x: "horizontal"  # Etiquetas horizontales en eje X
  
  # ** CONFIGURACIÓN PRINCIPAL: COLORES PERSONALIZADOS **
  paleta_colores: ["#114a44", "#739489", "#3d5c93", "#7393b3", "#6B5B95"]
  
  # Configuración visual
  grillas: true                  # Mantiene grillas por defecto
  
  # Configuración de datos adicionales
  agregar_datos: null
  asignar_etiquetas: null
  
  # Configuración de unión de barras
  union_izquierda: 0
  union_derecha: 0
  
  # Configuración de espaciado
  separar_por_total: 0.0
  espacio_inicio: 0
  altura_min: 0
  
  # Configuración de ejes
  y_limits: null
  nombre_eje_x: null
  nombre_eje_y: null
  resaltar_etiquetas: null
  
  # Configuración de cápsulas
  quitar_capsula: false
  
  # Configuración de porcentajes
  porcentaje_total_inicio: false
  
  # Configuración de colores de texto
  color_valor_barra: null
  
  # Configuración de figura
  aumenta_ancho_fig: 0
  aumenta_alto_fig: 0
  aumenta_sep_leyenda: 0.0

# Configuración de exclusiones
exclusiones: []

# Configuración de salida
salida:
  formato: ["png", "svg"]
  dpi: 300
  optimizar_svg: true
  directorio: "output"
  
# Configuración específica para datos divergentes
configuracion_divergentes:
  tipo: "barras_positivas_negativas"
  calculo_porcentajes: "por_seccion"  # Calcula % por sección pos/neg
  mostrar_totales_ambos: true
  sin_capsulas_cero: true
  
# Notas para el usuario
notas:
  - "Esta receta está diseñada para datos con valores positivos y negativos"
  - "Los porcentajes se calculan por sección (positivos vs negativos)"
  - "No muestra cápsulas cuando el total de una barra es cero"
  - "Mantiene el orden temporal de los datos"
  - "Usa tamaño de fuente pequeño (9) para etiquetas internas"
  - "Leyenda en 2 columnas para mejor organización"
  - "Paleta de colores verdes y azules para datos gubernamentales"
  - "Etiquetas horizontales para mejor legibilidad"
  - "Área mínima 0 para mostrar todas las etiquetas"
  
# Casos de uso
casos_uso:
  - "Análisis de flujos de personas desaparecidas/localizadas"
  - "Movimientos de entrada y salida por período"
  - "Análisis de ingresos vs gastos por año"
  - "Flujos migratorios (inmigración vs emigración)"
  - "Análisis de inventarios (entradas vs salidas)"
  - "Balances presupuestales por período"
  - "Análisis de crecimiento poblacional (nacimientos vs defunciones)"
  
# Estructura de datos esperada
datos_esperados:
  formato: "wide"
  columnas:
    - "Columna 1: períodos temporales (años, meses, etc.)"
    - "Columna 2-N: valores que pueden ser positivos o negativos"
    
  ejemplo:
    - "Año | Acumulado anterior | Desaparecidos | Localizados anteriores | Localizados período"
    - "2019 | 50000             | 20000         | -20000                 | -10000"
    - "2020 | 30000             | 10000         | -40000                 | -20000"
    - "2021 | 40000             | 30000         | -10000                 | -20000"
    
  caracteristicas:
    - "Valores positivos y negativos mezclados"
    - "Orden temporal debe mantenerse"
    - "Puede incluir años con totales cero"
    
# Personalización avanzada
personalizacion:
  colores:
    palette: ["#114a44", "#739489", "#3d5c93", "#7393b3", "#6B5B95"]
    tipo: "secuencial_mixta"
    
  etiquetas:
    tamaño: 9
    formato: "valor (porcentaje%)"
    orientacion: "horizontal"
    area_minima: 0
    
  totales:
    mostrar_positivos: true
    mostrar_negativos: true
    sin_capsulas_cero: true
    
  leyenda:
    posicion: "abajo"
    columnas: 2
    
# Variantes recomendadas
variantes:
  solo_valores:
    valor_barra: true
    porcentaje_barra: false
    
  solo_porcentajes:
    valor_barra: false
    porcentaje_barra: true
    
  con_capsulas_cero:
    capsulas_cero: true
    
  porcentaje_total_general:
    porcentaje_divergente: false
    
  etiquetas_verticales:
    orientacion_etiqueta_x: null
    
  leyenda_arriba:
    posicion_leyenda: "arriba"
    ncol_leyenda: 3
    
# Validaciones
validaciones:
  - "Verificar que existan valores tanto positivos como negativos"
  - "Confirmar que el orden temporal sea correcto"
  - "Validar que los totales por fila tengan sentido"
  - "Asegurar que las etiquetas sean legibles con tamaño 9"
  - "Verificar que la paleta de colores sea distinguible"
  
# Consideraciones especiales
consideraciones:
  - "Los porcentajes se calculan por sección (positivos/negativos por separado)"
  - "Las cápsulas de total no se muestran cuando el total es cero"
  - "El eje Y mantiene los valores negativos como negativos"
  - "La leyenda en 2 columnas ayuda con espacios reducidos"
  - "El tamaño de fuente pequeño permite más información por barra"