# Receta YAML para gráficas de barras verticales simples
# Tipo: Barras verticales básicas con configuración estándar
# Uso: Ideal para mostrar datos categóricos simples con una sola métrica

# Tipo de gráfico que se generará
tipo_grafico: "barras_verticales"

nombre: "barras_verticales_simples"
descripcion: "Gráfica de barras verticales básicas con configuración estándar para mostrar datos categóricos con una sola métrica por categoría"

# Parámetros de configuración
parametros:
  # Configuración básica
  ancho_barra: 0.7
  tipo_letra: "Montserrat"
  tam_letra_ejeX: 35
  tam_letra_ejeY: 30
  tam_letra_valor_capsu: 35
  tam_letra_valor_barra: 35
  tam_porce_total: 35
  
  # Configuración de posicionamiento
  ajusta_pos_capsu: 0.01
  separar_por_total: -0.0
  
  # Configuración de ordenamiento
  ordenar_por: "etiqueta"
  orden: "ascendente"
  
  # Configuración de valores y porcentajes
  porce_barra: false
  
  # Configuración de alineación
  alinea_capsu: true
  alinea_texto_barra: true

# Casos de uso
casos_uso:
  - "Comparación de valores por entidad federativa"
  - "Análisis de métricas por categoría"
  - "Presentación de datos administrativos simples"
  - "Reportes de indicadores por región"
  - "Visualización de cantidades por clasificación"
  - "Dashboards ejecutivos con datos categóricos"
  - "Informes gubernamentales con datos por estado"

# Notas de implementación
notas:
  - "Configuración básica sin porcentajes en barras para mayor simplicidad"
  - "alinea_capsu=true alinea las cápsulas de valores totales"
  - "alinea_texto_barra=true alinea el texto dentro de las barras"
  - "ajusta_pos_capsu=0.01 ajusta la posición de las cápsulas ligeramente"
  - "separar_por_total=-0.0 no agrega separación adicional"
  - "Tamaños de fuente grandes para máxima legibilidad"
  - "Ideal para presentaciones con datos categóricos simples"
  - "Configuración optimizada para entidades federativas u otras categorías"

# Datos de ejemplo requeridos
datos_ejemplo:
  tipo: "DataFrame con dos columnas: categoría y valor numérico"
  estructura: "Primera columna: categorías (ej. estados), segunda columna: valores numéricos"
  ejemplo: |
    df con columnas:
    - 'Entidad Federativa': ['Aguascalientes', 'Baja California', 'Baja California Sur', ...]
    - 'Cantidad': [45892, 78143, 22345, ...]
  nota: "Funciona mejor con 5-50 categorías para mantener legibilidad"

# Configuración de fuentes y tamaños
configuracion_fuentes:
  tipo_letra: "Montserrat (fuente institucional)"
  tam_letra_ejeX: 35
  tam_letra_ejeY: 30
  tam_letra_valor_capsu: 35
  tam_letra_valor_barra: 35
  tam_porce_total: 35
  nota: "Tamaños optimizados para presentaciones y reportes oficiales"

# Configuración de alineación
configuracion_alineacion:
  alinea_capsu: true
  descripcion_capsu: "Alinea las cápsulas de valores totales para presentación uniforme"
  alinea_texto_barra: true
  descripcion_texto: "Alinea el texto dentro de las barras para mejor legibilidad"
  ajusta_pos_capsu: 0.01
  descripcion_ajuste: "Ajuste fino de posición de cápsulas"

# Parámetros que pueden ser sobrescritos via kwargs
parametros_sobrescribibles:
  - "sustituir_etiquetas: para cambiar las etiquetas de las barras"
  - "espaciado: para ajustar el espaciado general"
  - "paleta_colores: para usar una paleta de colores específica"
  - "porce_barra: para habilitar porcentajes en barras"
  - "porce_total: para habilitar porcentajes totales"
  - "valor_barra: para mostrar valores dentro de las barras"
  - "leyenda: para mostrar leyenda"
  - "nombre_eje_x: para agregar título al eje X"
  - "nombre_eje_y: para agregar título al eje Y"
  - "ordenar_por: para cambiar criterio de ordenamiento ('valor' o 'etiqueta')"
  - "orden: para cambiar orden ('ascendente' o 'descendente')"

# Ejemplo de uso desde CLI
ejemplo_cli: |
  python generar_grafica.py --receta barras_verticales_simples --datos entidades_federativas.csv --ordenar_por "valor" --orden "descendente" --porce_total true --nombre_eje_x "Entidades Federativas" --nombre_eje_y "Cantidad"

# Variantes recomendadas
variantes:
  con_porcentajes:
    descripcion: "Agregar porcentajes totales"
    parametros: "--porce_total true"
  
  ordenado_por_valor:
    descripcion: "Ordenar por valores de mayor a menor"
    parametros: "--ordenar_por valor --orden descendente"
  
  con_colores_personalizados:
    descripcion: "Usar paleta de colores específica"
    parametros: '--paleta_colores ["#10302C", "#4C6A67", "#8FA8A6"]'
  
  con_valores_en_barras:
    descripcion: "Mostrar valores dentro de las barras"
    parametros: "--valor_barra true"

# Consideraciones especiales
consideraciones:
  - "Ideal para datos categóricos simples con una sola métrica"
  - "Los tamaños de fuente son apropiados para presentaciones oficiales"
  - "La alineación automática mejora la presentación visual"
  - "Funciona mejor con nombres de categorías no muy largos"
  - "Recomendado para máximo 32 categorías (como entidades federativas)"
  - "La configuración básica sin porcentajes mantiene la simplicidad"

# Validaciones recomendadas
validaciones:
  - "Verificar que la primera columna contenga categorías únicas"
  - "Confirmar que la segunda columna contenga valores numéricos"
  - "Revisar que no haya valores nulos o vacíos"
  - "Asegurar que los nombres de categorías sean legibles"
  - "Validar que el rango de valores permita buena visualización"

# Casos de uso específicos
casos_uso_especificos:
  entidades_federativas:
    descripcion: "Datos por estado de la república"
    ejemplo: "Población, casos, recursos, etc. por entidad federativa"
  
  dependencias_gobierno:
    descripcion: "Métricas por dependencia gubernamental"
    ejemplo: "Presupuesto, personal, proyectos por dependencia"
  
  indicadores_regionales:
    descripcion: "Indicadores por región geográfica"
    ejemplo: "Desarrollo, economía, salud por región"
  
  clasificaciones_administrativas:
    descripcion: "Datos por clasificación administrativa"
    ejemplo: "Trámites, servicios, quejas por tipo"
