# Receta YAML para gráficas de barras divergentes verticales simples
# Tipo: Barras verticales con valores positivos y negativos básicos
# Uso: Ideal para mostrar datos divergentes simples con configuración básica

# Tipo de gráfico que se generará
tipo_grafico: "barras"

nombre: "barras_divergentes_verticales_simple"
descripcion: "Gráfica de barras verticales divergentes con configuración básica para mostrar datos con valores positivos y negativos"

# Parámetros de configuración
parametros:
  # Configuración básica
  bar_height: 0.85
  font: "Montserrat"
  fontsize_barra: 35
  fontsize_eje_y: 30
  fontsize_valor_capsula: 18
  fontsize_valor_barra: 20
  
  # Configuración de ordenamiento
  ordenar_por: "etiqueta"
  orden: "ascendente"
  
  # Configuración de valores y porcentajes
  porcentaje_barra: false
  porcentaje_total: false
  
  # Configuración de separación
  aumenta_sep_leyenda: -0.25
  
  # Configuración de colores
  paleta_colores:
    - "#10302C"  # Verde oscuro
    - "#E6E6E6"  # Gris claro
    - "#FF5733"  # Naranja/rojo
    - "#C70039"  # Rojo oscuro
  
  # Colores específicos
  color_valor_capsula: "#3d5c93"   # Azul para valores de cápsula
  color_borde_capsula: "#900c3f"   # Granate para borde de cápsula

# Notas de implementación
notas:
  - "Configuración básica sin porcentajes para mayor simplicidad"
  - "aumenta_sep_eje_x=-0.25 ajusta la separación del eje X para mejor visualización"
  - "Paleta de colores contrastante para distinguir valores positivos y negativos"
  - "Tamaños de fuente optimizados para legibilidad"
  - "Colores personalizados para cápsulas de valores"
  - "Ideal para presentaciones ejecutivas que requieren claridad visual"
  - "Funciona mejor con datos que tienen clara separación entre positivos y negativos"
