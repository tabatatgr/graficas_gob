# Receta YAML para gráficas de barras divergentes
# Tipo: Barras verticales apiladas con valores positivos y negativos
# Uso: Ideal para mostrar datos que tienen componentes positivos y negativos, como desaparecidos vs localizados

# Tipo de gráfico que se generará
tipo_grafico: "barras"

nombre: "barras_divergentes"
descripcion: "Gráfica de barras verticales divergentes con valores positivos y negativos, incluyendo proyecciones futuras con estilos personalizados"

# Parámetros de configuración
parametros:
  # Configuración básica
  bar_height: 0.65
  bar_height_override: true
  font: "Montserrat"
  fontsize_barra: 9
  fontsize_barra_porcentaje: 7
  fontsize_valor_total: 15
  orientacion_etiqueta_x: "45"
  desplazamiento_capsula: 0.06
  
  # Configuración de ordenamiento
  ordenar_por: false
  orden: "ascendente"
  
  # Configuración de valores y porcentajes
  valor_barra: true
  valor_total: true
  porcentaje_barra: true
  porcentaje_total: false
  area_min: 0
  porcentaje_abajo: true
  
  # Configuración de leyenda
  leyenda: false
  posicion_leyenda: "abajo"
  ncol_leyenda: 2
  
  # Configuración específica para divergentes
  porcentaje_divergente: true
  ejeY_negativo_a_positivo: true
  capsulas_cero: false
  
  # Configuración de separación
  aumenta_sep_eje_x: -0.52
  
  # Configuración de colores
  paleta_colores:
    - "#114a44"  # Verde oscuro
    - "#739489"  # Verde medio
    - "#3d5c93"  # Azul oscuro
    - "#7393b3"  # Azul claro
    - "#6B5B95"  # Violeta


# Notas de implementación
notas:
  - "porcentaje_divergente=true calcula porcentajes por separado para valores positivos y negativos"
  - "ejeY_negativo_a_positivo=true muestra valores negativos como positivos en el eje Y"
  - "capsulas_cero=false oculta las cápsulas de valores cuando son cero"
  - "Los datos de proyección se agregan con estilos personalizados (líneas punteadas)"
  - "aumenta_sep_eje_x ajusta la separación del eje X para mejor visualización"
  - "La función requiere datos con valores positivos y negativos para funcionar correctamente"
  - "Los textos personalizados permiten formatear números con comas o texto específico"

