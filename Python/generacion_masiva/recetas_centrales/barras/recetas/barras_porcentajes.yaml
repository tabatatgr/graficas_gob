# Receta para barras de porcentaje
# Configuración basada en el ejemplo EXPORTAR: barras_porcentaje

# Tipo de gráfico que se generará
tipo_grafico: "barras_verticales"

metadata:
  titulo: "Barras de Porcentaje"
  descripcion: "Gráfico de barras verticales que muestra valores como porcentajes relativos"
  version: "1.0"
  autor: "Sistema de Generación Masiva"
  fecha: "2025-01-10"

# Configuración del gráfico
grafico:
  tipo: "barras_verticales"
  nombre: "barras_porcentaje"
  
# Configuración de datos
datos:
  hoja: null
  rango: null

# Parámetros de la función barras_verticales
parametros:
  # Configuración básica
  bar_height: 0.9
  font: "Poppins"
  fontsize_barra: 17
  fontsize_valor_total: 20
  
  # Ordenamiento
  ordenar_por: "etiqueta"
  orden: "ascendente"
  
  # ** CONFIGURACIÓN PRINCIPAL: VALORES COMO PORCENTAJES **
  valor_barra: false           # No muestra valores absolutos
  valor_total: false           # No muestra totales arriba
  porcentaje_barra: true       # Muestra porcentajes dentro de cada segmento
  porcentaje_total: false      # No muestra porcentaje total arriba
  
  # Configuración visual
  area_min: 10                 # Área mínima para mostrar etiquetas
  grillas: false               # Sin grillas para diseño limpio
  
  # ** CONFIGURACIÓN PRINCIPAL: LÍMITES Y EJES **
  y_limits: [0, 100]          # Escala fija de 0 a 100%
  nombre_eje_x: "Fecha"       # Etiqueta del eje X
  nombre_eje_y: "Porcentaje"  # Etiqueta del eje Y
  
  # Configuración de cápsulas
  quitar_capsula: false
  capsulas_cero: true
  
  # Configuración de colores
  paleta_colores: null         # Usa paleta por defecto
  
  # Configuración de leyenda
  leyenda: null                # Sin leyenda por defecto
  posicion_leyenda: "arriba"
  ncol_leyenda: null
  
  # Configuración de orientación
  orientacion_etiqueta_x: null  # Vertical por defecto
  
  # Configuración de datos adicionales
  agregar_datos: null
  asignar_etiquetas: null
  
  # Configuración de unión de barras
  union_izquierda: 0
  union_derecha: 0
  
  # Configuración de porcentajes
  porcentaje_abajo: true
  porcentaje_total_inicio: false
  porcentaje_divergente: false
  
  # Configuración de espaciado
  separar_por_total: 0.0
  espacio_inicio: 0
  altura_min: 0
  
  # Configuración de ejes especiales
  ejeY_negativo_a_positivo: false
  resaltar_etiquetas: null
  
  # Configuración de colores de texto
  color_valor_barra: null
  
  # Configuración de figura
  aumenta_ancho_fig: 0
  aumenta_alto_fig: 0
  aumenta_sep_leyenda: 0.0
  
  # Configuración de datos adicionales
  sustituir_etiquetas: null

# Configuración de exclusiones
exclusiones: []

# Configuración de salida
salida:
  formato: ["png", "svg"]
  dpi: 300
  optimizar_svg: true
  directorio: "output"
  
# Configuración específica para porcentajes
configuracion_porcentajes:
  tipo: "porcentajes_relativos"
  suma_total: 100
  precision_decimal: 1
  mostrar_simbolo: true
  
# Notas para el usuario
notas:
  - "Esta receta está optimizada para datos que suman 100% por fila"
  - "Los valores se muestran como porcentajes dentro de cada segmento"
  - "El eje Y está fijo entre 0 y 100 para consistencia"
  - "Ideal para composición de datos, distribuciones o partes de un todo"
  - "Usa fuente Poppins para un diseño más moderno"
  - "Sin grillas para un aspecto más limpio"
  - "Área mínima de 10 para evitar etiquetas sobrepuestas"
  
# Casos de uso
casos_uso:
  - "Distribución de presupuesto por categorías"
  - "Composición demográfica por períodos"
  - "Participación de mercado por año"
  - "Distribución de votos por candidato"
  - "Asignación de recursos por departamento"
  - "Análisis de tiempo dedicado a actividades"
  - "Estructura de gastos gubernamentales"
  
# Estructura de datos esperada
datos_esperados:
  formato: "wide"
  columnas:
    - "Columna 1: fechas o categorías (eje X)"
    - "Columna 2-N: valores que suman 100% por fila"
  
  ejemplo:
    - "fecha | A | B | C"
    - "2023  | 45.2 | 30.1 | 24.7"
    - "2024  | 50.0 | 25.0 | 25.0"
    
  validacion: "Los valores por fila deben sumar aproximadamente 100"
  
# Personalización avanzada
personalizacion:
  fuente: "Poppins"
  tamaño_etiquetas: 17
  precision_porcentaje: 1
  
  ejes:
    x: "Fecha"
    y: "Porcentaje"
    limites_y: [0, 100]
    
  visualizacion:
    sin_grillas: true
    area_minima: 10
    altura_barra: 0.9
    
# Variantes recomendadas
variantes:
  con_leyenda:
    leyenda: true
    posicion_leyenda: "arriba"
    
  con_valores_absolutos:
    valor_barra: true
    porcentaje_barra: true
    
  horizontal:
    orientacion_etiqueta_x: "horizontal"
    
  con_grillas:
    grillas: true