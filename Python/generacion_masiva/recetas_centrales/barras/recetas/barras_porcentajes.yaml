tipo_grafico: "barras"
nombre: "barras_porcentajes"

parametros:
  bar_height: 0.9
  bar_height_override: true 
  font: "Poppins"
  fontsize_barra: 17
  fontsize_valor_total: 20
  ordenar_por: "etiqueta"
  orden: "ascendente"
  valor_barra: false
  valor_total: false
  porcentaje_barra: true
  porcentaje_total: false
  porcentaje_total_inicio: false
  area_min: 10
  grillas: false
  y_limits: [0, 100]
  nombre_eje_x: "Fecha"
  nombre_eje_y: "Porcentaje"
  quitar_capsula: false
  capsulas_cero: true
  paleta_colores: null
  leyenda: null
  posicion_leyenda: "arriba"
  ncol_leyenda: null
  orientacion_etiqueta_x: "45"
  agregar_datos: null
  asignar_etiquetas: null
  union_izquierda: 0
  union_derecha: 0
  porcentaje_abajo: true
  aumenta_ancho_fig: 8
  # Configuración de espaciado
  separar_por_total: 0.0
  espacio_inicio: 0
  altura_min: 0
  
  # Configuración de ejes especiales
  ejeY_negativo_a_positivo: false
  resaltar_etiquetas: null
  
  # Configuración de colores de texto
  color_valor_barra: null
  
  # Configuración de figura
  aumenta_ancho_fig: 8               # haz la figura más ancha
  aumenta_alto_fig: 0
  aumenta_sep_leyenda: 0.0
  
  # Configuración de datos adicionales
  sustituir_etiquetas: null

# Configuración de exclusiones
exclusiones: []

# Configuración de salida
salida:
  formato: ["png", "svg"]
  dpi: 300
  optimizar_svg: true
  directorio: "output"
  
# Configuración específica para porcentajes
configuracion_porcentajes:
  tipo: "porcentajes_relativos"
  suma_total: 100
  precision_decimal: 1
  mostrar_simbolo: true
  
# Notas para el usuario
notas:
  - "Esta receta está optimizada para datos que suman 100% por fila"
  - "Los valores se muestran como porcentajes dentro de cada segmento"
  - "El eje Y está fijo entre 0 y 100 para consistencia"
  - "Ideal para composición de datos, distribuciones o partes de un todo"
  - "Usa fuente Poppins para un diseño más moderno"
  - "Sin grillas para un aspecto más limpio"
  - "Área mínima de 10 para evitar etiquetas sobrepuestas"
  
# Casos de uso
casos_uso:
  - "Distribución de presupuesto por categorías"
  - "Composición demográfica por períodos"
  - "Participación de mercado por año"
  - "Distribución de votos por candidato"
  - "Asignación de recursos por departamento"
  - "Análisis de tiempo dedicado a actividades"
  - "Estructura de gastos gubernamentales"
  
# Estructura de datos esperada
datos_esperados:
  formato: "wide"
  columnas:
    - "Columna 1: fechas o categorías (eje X)"
    - "Columna 2-N: valores que suman 100% por fila"
  
  ejemplo:
    - "fecha | A | B | C"
    - "2023  | 45.2 | 30.1 | 24.7"
    - "2024  | 50.0 | 25.0 | 25.0"
    
  validacion: "Los valores por fila deben sumar aproximadamente 100"
  
# Personalización avanzada
personalizacion:
  fuente: "Poppins"
  tamaño_etiquetas: 17
  precision_porcentaje: 1
  
  ejes:
    x: "Fecha"
    y: "Porcentaje"
    limites_y: [0, 100]
    
  visualizacion:
    sin_grillas: true
    area_minima: 10
    altura_barra: 0.9
    
# Variantes recomendadas
variantes:
  con_leyenda:
    leyenda: true
    posicion_leyenda: "arriba"
    
  con_valores_absolutos:
    valor_barra: true
    porcentaje_barra: true
    
  horizontal:
    orientacion_etiqueta_x: "horizontal"
    
  con_grillas:
    grillas: true