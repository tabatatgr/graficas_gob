

# Receta para barras horizontales con porcentaje al inicio
# Ideal para mostrar proporciones y valores absolutos simultáneamente

tipo_grafico: "barras"

metadata:
  titulo: "Barras Horizontales con Porcentaje al Inicio"
  descripcion: "Gráfica de barras horizontales que muestra el porcentaje al inicio de cada barra y valores absolutos."
  version: "1.0"
  autor: "Sistema de Generación Masiva"
  fecha: "2025-07-29"
# Parámetros de configuración
parametros:
  bar_height: 0.7
  font: "Poppins"
  fontsize_barra: 18
  fontsize_valor_total: 24
  valor_barra: true
  porcentaje_total_inicio: true
  color_porcentaje_inicio: "#6c757d"
  orientacion: "horizontal"
  ordenar_por: "valor"
  orden: "ascendente"
  quitar_capsula: true
  espacio_inicio: 70
  area_min: 350
  paleta_colores:
    - "#8B0000"
    - "#B22222"
    - "#CD5C5C"
    - "#F08080"

# Notas importantes para el usuario
notas:
  - "El parámetro porcentaje_total_inicio: true coloca el porcentaje al inicio de cada barra."
  - "espacio_inicio: 70 ajusta el espacio para mostrar los porcentajes correctamente."
  - "quitar_capsula: true elimina el borde de los valores totales para un diseño más limpio."
  - "La paleta de colores usa tonos rojos en degradé para énfasis visual."
  - "ordenar_por: 'valor' y orden: 'ascendente' ordena de menor a mayor valor."
