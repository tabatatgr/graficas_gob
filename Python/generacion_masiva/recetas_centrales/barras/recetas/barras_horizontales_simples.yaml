# Receta para barras horizontales simples
# Configuración basada en el ejemplo EXPORTAR: barras_horizontales_simples

tipo_grafico: "barras"
nombre: "barras_horizontales_simples"

metadata:
  titulo: "Barras Horizontales Simples"
  descripcion: "Gráfico de barras horizontales simples ordenadas por etiqueta"
  version: "1.0"
  autor: "Sistema de Generación Masiva"
  fecha: "2025-01-10"

# Configuración del gráfico
grafico:
  tipo: "barras"
  nombre: "barras_horizontales_simples"
  
# Configuración de datos
datos:
  hoja: null
  rango: null

# Parámetros de la función barras
parametros:
  orientacion: "horizontal"
  # Configuración básica
  bar_height: 0.8             # Barras anchas para mejor visualización
  font: "Montserrat"
  fontsize_barra: 15           # Tamaño medio para etiquetas internas
  fontsize_valor_total: 20
  bar_height_override: true     # Tamaño destacado para totales
  
  # ** CONFIGURACIÓN PRINCIPAL: ORIENTACIÓN **
  orientacion: "horizontal"     # Barras horizontales
  
  # ** CONFIGURACIÓN PRINCIPAL: ORDENAMIENTO **
  ordenar_por: "etiqueta"      # Ordena por nombre de categoría
  orden: "ascendente"          # Orden alfabético A-Z
  
  # ** CONFIGURACIÓN PRINCIPAL: ETIQUETAS DE VALORES **
  valor_barra: false           # No muestra valores dentro de barras
  porcentaje_barra: false      # No muestra porcentajes dentro de barras
  porcentaje_total: true       # Muestra porcentajes totales al final
  valor_total: true            # Muestra totales al final (por defecto)
  
  # ** CONFIGURACIÓN PRINCIPAL: ESPACIADO **
  area_min: 300                # Área mínima para mostrar etiquetas
  separar_por_total: 0.05      # Separación entre total y porcentaje
  
  # Configuración de cápsulas
  quitar_capsula: false        # Mantiene cápsulas en totales
  
  # Configuración de ordenamiento
  porcentaje_total_inicio: false
  
  # Configuración de datos adicionales
  agregar_datos: null
  asignar_etiquetas: null
  
  # Configuración de unión de barras
  union_izquierda: 0
  union_derecha: 0
  
  # Configuración de espaciado
  espacio_inicio: 0
  altura_min: 0
  
  # Configuración de leyenda
  leyenda: null                # Sin leyenda para barras simples
  posicion_leyenda: "arriba"
  
  # Configuración de colores
  paleta_colores: null         # Usa colores por defecto
  color_valor_barra: null
  
  # Configuración visual
  grillas: true                # Mantiene grillas por defecto
  porcentaje_abajo: true       # Configuración por defecto
  
  # Configuración de ejes
  y_limits: null
  nombre_eje_x: null
  nombre_eje_y: null
  orientacion_etiqueta_x: null
  resaltar_etiquetas: null
  
  # Configuración de etiquetas
  sustituir_etiquetas: null
  
  # Configuración de figura
  aumenta_ancho_fig: 0
  aumenta_alto_fig: 0
  aumenta_sep_leyenda: 0.0

# Configuración de exclusiones
exclusiones: []

# Configuración de salida
salida:
  formato: ["png", "svg"]
  dpi: 300
  optimizar_svg: true
  directorio: "output"
  
notas:
  - "Esta receta está optimizada para barras horizontales simples"
  - "Ideal para comparar categorías con nombres largos"
  - "Ordena alfabéticamente por nombre de categoría"
  - "Muestra solo totales y porcentajes, sin valores internos"
  - "Usa separación adicional entre total y porcentaje"
  - "Barras anchas (0.9) para mejor legibilidad"
  - "Área mínima de 300 para evitar etiquetas en barras pequeñas"
  - "Sin leyenda ya que es una sola serie de datos"